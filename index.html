<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- PWA: make the app installable ("Install app" / Add to Home Screen). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#15795b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SupaNet" />
    <link rel="apple-touch-icon" href="/icon-maskable.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>SupaNet</title>
    <script>
      // Apply the saved theme before paint to avoid a flash of the wrong theme.
      try {
        var t = localStorage.getItem('theme') || 'light'
        document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
