[package]
name = "supanet-desktop"
version = "0.1.1"
description = "SupaNet desktop — runs the intranet on this machine against a local Supabase stack"
edition = "2021"

[lib]
name = "supanet_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
