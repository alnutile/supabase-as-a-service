# Supabase CLI config. `project_id` is set when you run `supabase link`.
project_id = "intranet"

[functions.chat]
verify_jwt = true

[functions.email-test]
verify_jwt = true

[functions.mcp-admin]
verify_jwt = true

[functions.forge]
verify_jwt = true

[functions.loop]
verify_jwt = true

# Public / token-gated functions — must stay verify_jwt = false so external
# callers (and pg_cron via pg_net) reach them without a Supabase JWT. They are
# gated instead by an unguessable token in the URL (webhook / email-inbound), a
# per-user token (mcp), or the cron secret (scheduler / ingest). Declaring them
# here keeps a plain `supabase functions deploy <name>` from flipping them back
# to the verify_jwt=true default.
[functions.webhook]
verify_jwt = false

[functions.mcp]
verify_jwt = false

[functions.email-inbound]
verify_jwt = false

[functions.scheduler]
verify_jwt = false

[functions.ingest]
verify_jwt = false

# Serves a shared HTML artifact as a clean standalone page (gated by RLS via the
# anon key — only non-private artifacts are ever returned).
[functions.p]
verify_jwt = false

# Plain-REST CRUD API around artifacts, gated by a per-user bearer token
# (mcp_tokens) instead of a Supabase JWT, so external systems can push/sync
# artifacts and tag them into collections.
[functions.artifacts]
verify_jwt = false

# Plain-REST CRUD API around to-dos, same bearer-token (mcp_tokens) auth as the
# artifacts function, so external systems can capture/sync tasks and tag them
# into collections.
[functions.todos]
verify_jwt = false
