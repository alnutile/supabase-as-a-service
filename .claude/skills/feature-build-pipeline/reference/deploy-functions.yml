name: Deploy edge functions

# Edge functions don't ride the frontend's auto-deploy from `main` (that only
# rebuilds the Vite app + applies DB migrations out-of-band). This workflow
# deploys the repo's Supabase Edge Functions whenever their source changes on
# `main`, so a push to `chat`/`_shared/*`/etc. goes live without a manual step.
#
# Scope: this only deploys the CORE functions that live in this repo. "Forged"
# (vibe-coded) functions live in the database, not git, so they have no source
# here — redeploy those from the in-app Forge → "Redeploy forged functions"
# button instead.
#
# Setup — you only need ONE secret:
#   SUPABASE_ACCESS_TOKEN  – a Supabase personal access token (Dashboard →
#                            Account → Access Tokens). Same kind of token as the
#                            FORGE_PAT edge secret; you can reuse that value.
#                            Add it under Settings → Secrets and variables →
#                            Actions → New repository secret.
#
# The project ref is NOT a secret (it's in your public Supabase URL), so it
# defaults below. If you fork this to a different project, set a repository
# VARIABLE named SUPABASE_PROJECT_REF (Settings → Secrets and variables →
# Actions → Variables) to override the default — no code change needed.
#
# verify_jwt per function is read from supabase/config.toml, so the public
# (token-gated) functions stay verify_jwt = false on deploy.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch: {}

# One deploy at a time; cancel an in-flight run if a newer push lands.
concurrency:
  group: deploy-functions
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Public (it's in your Supabase URL), so it lives here as a plain default;
      # override with a repository variable if you point this at another project.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pcyvmpjrszgatwvmyxbg' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions). Create the token at Supabase Dashboard → Account → Access Tokens."
            exit 1
          fi

      # Deploys every function under supabase/functions (dirs starting with `_`,
      # like `_shared`, are ignored). verify_jwt comes from supabase/config.toml.
      - name: Deploy functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
