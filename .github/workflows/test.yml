# Lint + typecheck + unit tests + an authenticated smoke test, on every PR
# and every push to main.
#
# Note: PRs opened by the feature bot use the workflow-minted GITHUB_TOKEN,
# and GitHub does not fire pull_request workflows for those (anti-recursion).
# That's why claude-feature.yml runs the same tests itself against the built
# branch — this workflow covers human PRs and everything landing on main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: smoke.anon.key
      - run: npm test
      # Does the signed-in app actually come up? Everything above is blind to a
      # crash in the shell that wraps every page: lint and typecheck are static,
      # the unit suite mounts one component at a time, and /login is the only
      # route that renders without a session. PR #382 shipped a blank page on
      # every authenticated route with all of it green. This loads real built
      # routes in a real browser against a stubbed Supabase and fails on an
      # uncaught page error or an empty #root. It reuses the Chrome already on
      # the runner, so there is no browser download.
      - run: npm run test:smoke

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The deno tests fetch remote deps (e.g. croner from esm.sh) at run time,
      # so a transient CDN outage (esm.sh 522) can fail an otherwise-green run.
      # Retry a few times with backoff so infra flakes don't red-flag main; a
      # real test failure still fails all attempts.
      - name: deno test (retry transient network failures)
        run: |
          for attempt in 1 2 3; do
            echo "::group::deno test (attempt $attempt)"
            if deno test supabase/functions/tests/; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed; retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done
          echo "deno test failed after 3 attempts"
          exit 1
