# Lint + typecheck + unit tests, on every PR and every push to main.
#
# Note: PRs opened by the feature bot use the workflow-minted GITHUB_TOKEN,
# and GitHub does not fire pull_request workflows for those (anti-recursion).
# That's why claude-feature.yml runs the same tests itself against the built
# branch — this workflow covers human PRs and everything landing on main.
name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `supabase db push` derives each migration's version from the numeric
      # filename prefix, so two files sharing a prefix means one silently never
      # deploys (it has already happened twice: 0056_security_scans,
      # 0058_artifact_images). Fail the PR instead.
      - name: Migration prefixes must be unique
        run: |
          dups=$(ls supabase/migrations | grep -oE '^[0-9]+' | sort | uniq -d)
          if [ -n "$dups" ]; then
            echo "::error::Duplicate migration number prefix(es): $dups — renumber to the next free number (see CLAUDE.md)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  edge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test supabase/functions/tests/
