name: Apply database migrations

# Companion to deploy-functions.yml. Pushing to `main` rebuilds the frontend
# (Railway) and deploys edge functions; this workflow applies any NEW migration
# file(s) that landed in the push.
#
# Why not `supabase db push`? This project's migration history was built through
# the Supabase Management API (the same path the in-app Forge + the MCP
# `apply_migration` use), so its remote `supabase_migrations` history is stamped
# with TIMESTAMP versions (e.g. 20260627203631) while this repo names files
# sequentially (0037_*.sql). `db push` matches by version string, so it rejects
# every push ("remote migration versions not found locally"). Instead we apply
# the newly-added files directly via the Management API "run a query" endpoint —
# PAT-only, no DB password needed.
#
# How "new" is decided: the git diff of the push range (before..after), filtered
# to ADDED files under supabase/migrations/. Normal flow = one migration per PR,
# squash-merged to main → exactly that file is applied. Because application is
# diff-driven (not history-tracked), re-running the SAME commit would re-apply
# its files (and DDL like `create table` would then error) — re-runs are manual,
# so this is an accepted trade-off, not a routine path.
#
# Setup — ONE secret (the same one the functions workflow already uses):
#   SUPABASE_ACCESS_TOKEN  – a Supabase personal access token (Dashboard →
#                            Account → Access Tokens; same kind as FORGE_PAT).
# Project ref is public (it's in your Supabase URL) so it defaults below;
# override with a repository VARIABLE named SUPABASE_PROJECT_REF.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch: {}

# Apply one migration run at a time, and NEVER cancel an in-flight one — a
# half-applied set is worse than waiting.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Public (it's in your Supabase URL); override with a repository variable
      # if you point this at another project.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pcyvmpjrszgatwvmyxbg' }}
    steps:
      # Need full history so we can diff the push range to find new migrations.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required secret
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (reuse the same token as the functions workflow / FORGE_PAT). Create it at Supabase Dashboard → Account → Access Tokens."
            exit 1
          fi

      - name: Apply new migrations
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Pick a diff range. On the first push to a branch (or a force-push)
          # github.event.before may be the zero SHA or unreachable — fall back to
          # the pushed commit's first parent. workflow_dispatch has no `before`.
          ZERO="0000000000000000000000000000000000000000"
          if [ -z "${BEFORE:-}" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            RANGE_BASE="$(git rev-parse HEAD~1 2>/dev/null || echo '')"
          else
            RANGE_BASE="$BEFORE"
          fi

          if [ -n "$RANGE_BASE" ]; then
            FILES="$(git diff --name-only --diff-filter=A "$RANGE_BASE" "$AFTER" -- 'supabase/migrations/*.sql' | sort)"
          else
            # No base to diff against (e.g. very first commit): apply nothing
            # automatically rather than risk re-running the whole directory.
            FILES=""
          fi

          if [ -z "$FILES" ]; then
            echo "No newly-added migration files in this push — nothing to apply."
            exit 0
          fi

          echo "New migration files to apply:"
          echo "$FILES"

          API="https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/database/query"
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Applying $f"
            # jq -Rs reads the whole file as one JSON string → safe escaping.
            payload="$(jq -Rs '{query: .}' < "$f")"
            http_code="$(
              curl -sS -o /tmp/mig_resp.json -w '%{http_code}' -X POST "$API" \
                -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
                -H "Content-Type: application/json" \
                -d "$payload"
            )"
            if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
              echo "::error::Migration $f failed (HTTP $http_code): $(cat /tmp/mig_resp.json)"
              exit 1
            fi
            echo "Applied $f (HTTP $http_code)"
            echo "::endgroup::"
          done <<< "$FILES"

          echo "All new migrations applied."
