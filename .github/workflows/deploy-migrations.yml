name: Apply database migrations

# Companion to deploy-functions.yml. Pushing to `main` rebuilds the frontend
# (Railway) and deploys edge functions, but DB migrations otherwise had to be
# applied by hand. This workflow runs `supabase db push` whenever a migration
# changes on `main`, so a new file under supabase/migrations/ goes live without
# a manual step. The CLI tracks what's already applied (supabase_migrations
# schema), so re-runs only apply pending migrations — it's safe to re-trigger.
#
# Setup — TWO secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – the SAME Supabase personal access token the
#                            functions workflow already uses (reused here).
#   SUPABASE_DB_PASSWORD   – your project's database password (Dashboard →
#                            Project Settings → Database → Database password).
#                            REQUIRED: `db push` connects straight to Postgres,
#                            so the access token alone is NOT enough to apply
#                            migrations — it needs the DB password.
#
# The project ref is NOT a secret (it's in your public Supabase URL); it
# defaults below and is overridable with a repository VARIABLE named
# SUPABASE_PROJECT_REF — same convention as deploy-functions.yml.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-migrations.yml'
  workflow_dispatch: {}

# Apply one migration run at a time, and NEVER cancel an in-flight one — a
# half-applied migration set is worse than waiting.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Public (it's in your Supabase URL); override with a repository variable
      # if you point this at another project.
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'pcyvmpjrszgatwvmyxbg' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (reuse the same token as the functions workflow / FORGE_PAT)."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_DB_PASSWORD repository secret (Supabase Dashboard → Project Settings → Database → Database password). 'supabase db push' needs the DB password; the access token alone can't apply migrations."
            exit 1
          fi

      # Link picks up SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD from the env,
      # so neither step prompts interactively.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      # Applies every pending file under supabase/migrations/ in order and
      # records them in the remote migration history.
      - name: Push migrations
        run: supabase db push
