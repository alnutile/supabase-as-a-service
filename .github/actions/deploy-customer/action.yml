name: Deploy customer
description: >
  Deploy the core SupaNet backend (DB migrations + edge functions) to ONE
  customer's Supabase project. Wraps the exact CLI invocations proven in
  deploy-migrations.yml and deploy-functions.yml so the single-target and
  fleet paths never drift. GitHub Actions does not support YAML anchors, so
  this composite action is how the fleet workflow's two matrix jobs (canary
  and fleet) stay DRY.

inputs:
  ref:
    description: Supabase project ref (public — it's in the project URL).
    required: true
  db_password:
    description: >
      Database password for this project. `supabase db push` connects straight
      to Postgres, so the access token alone can't apply migrations — it needs
      the DB password. Sourced per-customer from the CUSTOMER_DB_PASSWORDS JSON
      secret by the caller.
    required: true
  access_token:
    description: >
      Supabase personal access token for the host org. One host token reaches
      every customer project because they all live under the host's Supabase
      org — that's what makes the fan-out trivial.
    required: true

runs:
  using: composite
  steps:
    - name: Install Supabase CLI
      uses: supabase/setup-cli@v1
      with:
        version: latest

    # All three values are passed through env (not inline `${{ }}` in the
    # script body) so the shell never sees them as literal text, matching the
    # `$SUPABASE_ACCESS_TOKEN` style of the single-target workflows.
    - name: Deploy to ${{ inputs.ref }}
      shell: bash
      env:
        SUPABASE_ACCESS_TOKEN: ${{ inputs.access_token }}
        SUPABASE_DB_PASSWORD: ${{ inputs.db_password }}
        REF: ${{ inputs.ref }}
      run: |
        # A password extracted from a JSON secret via fromJson() is NOT
        # guaranteed to be masked in logs — register it explicitly.
        [ -n "$SUPABASE_DB_PASSWORD" ] && echo "::add-mask::$SUPABASE_DB_PASSWORD"

        if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
          echo "::error::Missing SUPABASE_ACCESS_TOKEN (host Supabase access token)."
          exit 1
        fi
        if [ -z "$REF" ]; then
          echo "::error::Missing project ref for this customer (check customers.json)."
          exit 1
        fi
        if [ -z "$SUPABASE_DB_PASSWORD" ]; then
          echo "::error::No DB password for $REF — add \"$REF\":\"<password>\" to the CUSTOMER_DB_PASSWORDS secret. 'supabase db push' needs it."
          exit 1
        fi

        # link/db push pick up SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD from
        # env, so nothing prompts interactively.
        supabase link --project-ref "$REF"
        # --include-all also applies files that sort before the newest remote
        # version (e.g. a migration applied out of band), matching
        # deploy-migrations.yml. Safe no-op when nothing is pending.
        supabase db push --include-all
        # verify_jwt per function comes from supabase/config.toml.
        supabase functions deploy --project-ref "$REF"
